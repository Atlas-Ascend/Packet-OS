schema: ghost-atlas.packet-os.estate-wiring/v1
packet_os: Atlas-Ascend/Packet-OS
routes:
  - producer: Atlas-Ascend/Atlas-Mind-LLM
    consumer: Atlas-Ascend/Janus-Prime
    contract: packet-proposal
    note: cognition proposes; JANUS authorizes
  - producer: Atlas-Ascend/MAAT-Universal-CaseGraph
    consumer: Atlas-Ascend/Packet-OS
    contract: case-context-reference
    note: Packet OS stores references, not CaseGraph authority
  - producer: Atlas-Ascend/Janus-Prime
    consumer: Atlas-Ascend/Packet-OS
    contract: authorized-intent
    event: packet.authorized
  - producer: Atlas-Ascend/Packet-OS
    consumer: Atlas-Ascend/workforce-spine
    contract: packet/v1
    event: packet.queued
  - producer: Atlas-Ascend/workforce-spine
    consumer: Atlas-Ascend/Packet-OS
    contract: worker-claim
    event: packet.claimed
  - producer: Atlas-Ascend/Packet-OS
    consumer: Atlas-Ascend/Crowngrid
    contract: capability-request-reference
    note: CrownGrid routes capabilities; Packet OS does not
  - producer: Atlas-Ascend/Packet-OS
    consumer: Atlas-Ascend/Ghost-Atlas-Distributed-Agentic-Organism
    contract: bounded-work-packet
  - producer: Atlas-Ascend/Packet-OS
    consumer: Atlas-Ascend/Ghost-Atlas-Software-Factory-End-to-End-SDLC-Control-Plane
    contract: build-packet
    condition: metadata.kind == software-build
  - producer: Atlas-Ascend/Packet-OS
    consumer: Atlas-Ascend/Ghost-Atlas-Estate-Event-Gateway
    contract: event/v1
    event: packet.*
  - producer: Atlas-Ascend/Ghost-Atlas-Estate-Event-Gateway
    consumer: Atlas-Ascend/Ghost-Atlas-Runtime-Observatory
    contract: mirrored-runtime-event
  - producer: execution-organ
    consumer: Atlas-Ascend/DEVOS
    contract: implementation-failure
    event: packet.failed
  - producer: Atlas-Ascend/Packet-OS
    consumer: Atlas-Ascend/SECA
    contract: verification-request
    condition: state == REVIEW
  - producer: Atlas-Ascend/SECA
    consumer: Atlas-Ascend/Packet-OS
    contract: verification-result
    event: packet.verified
invariants:
  - JANUS retains executive authorization
  - Workforce Spine retains worker selection and scheduling
  - CrownGrid retains capability routing
  - DEVOS owns implementation remediation
  - SECA retains finish truth
