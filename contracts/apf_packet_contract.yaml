schema: ghost-atlas.packet-os.apf/v1
producer: JANUS-ATLAS-PROMPT-FABRIC
consumer: Packet-OS
required:
  - packet_id
  - correlation_id
  - run_id
  - attempt
  - state
  - objective
  - inputs
  - authority
  - authorization_ref
  - executor
  - dependencies
  - actions
  - tests
  - proof
  - evidence_links
  - replay_policy
  - rollback
  - workforce_handoff
  - completion_condition
constraints:
  atomic: true
  bounded: true
  destructive_default: false
  idempotent_preferred: true
  explicit_authority_required: true
  receipt_required: true
  correlation_immutable: true
  run_identity_required_before_dispatch: true
  replay_requires_same_packet_and_correlation: true
  replay_must_not_duplicate_completed_effect: true
  rollback_must_reference_prior_effect_or_artifact: true
  rollback_receipt_required_when_invoked: true
  state_transition_receipt_required: true
lifecycle:
  initial_state: ADMITTED
  terminal_states: [COMPLETED, FAILED, BLOCKED, ROLLED_BACK]
  transitions:
    ADMITTED: [AUTHORIZED, BLOCKED]
    AUTHORIZED: [READY, BLOCKED]
    READY: [DISPATCHED, BLOCKED]
    DISPATCHED: [ACKNOWLEDGED, BLOCKED]
    ACKNOWLEDGED: [RUNNING, BLOCKED]
    RUNNING: [VERIFYING, FAILED, BLOCKED]
    VERIFYING: [COMPLETED, FAILED, BLOCKED]
    FAILED: [READY, ROLLED_BACK]
    BLOCKED: [READY, ROLLED_BACK]
    COMPLETED: []
    ROLLED_BACK: []
  transition_receipt_required:
    - packet_id
    - correlation_id
    - run_id
    - attempt
    - from_state
    - to_state
    - occurred_at
    - evidence_ref
  guards:
    AUTHORIZED: authorization_ref_required
    READY: retry_lineage_required_when_attempt_gt_1
    DISPATCHED: workforce_handoff_required
    ACKNOWLEDGED: downstream_ack_required
    RUNNING: observed_executor_receipt_required
    VERIFYING: execution_receipt_required
    COMPLETED: proof_and_downstream_receipts_required
    ROLLED_BACK: rollback_receipt_and_compensation_evidence_required
workforce_handoff:
  required: [packet_id, correlation_id, run_id, attempt, authorization_ref, owner, destination, acknowledgement_required]
  acknowledgement_required: true
  completion_requires_downstream_receipt: true
replay_policy:
  default: deny_after_completed
  retry_requires_explicit_attempt_and_prior_receipt: true
  retry_requires_prior_packet_state: [FAILED, BLOCKED]
  retry_attempt_must_increment: true
  retry_of_receipt_required_after_first_attempt: true
  new_effect_requires_new_packet_id: true
rollback_policy:
  allowed_from: [FAILED, BLOCKED]
  requires_prior_effect_or_artifact_ref: true
  requires_prior_receipt_ref: true
  requires_compensation_evidence: true
  transition_target: ROLLED_BACK
failure_output:
  - failed_stage
  - failed_assertion
  - artifact
  - diagnostic_evidence
  - repair_packet
  - resume_point
completion: packet_is_complete_only_when_tests_required_proof_and_downstream_receipts_pass
