schema: ghost-atlas.packet-os.apf/v1
producer: JANUS-ATLAS-PROMPT-FABRIC
consumer: Packet-OS
required: [packet_id,objective,inputs,authority,executor,dependencies,actions,tests,proof,rollback,completion_condition]
constraints:
  atomic: true
  bounded: true
  destructive_default: false
  idempotent_preferred: true
  explicit_authority_required: true
  receipt_required: true
failure_output: [failed_stage,failed_assertion,artifact,diagnostic_evidence,repair_packet,resume_point]
completion: packet_is_complete_only_when_tests_and_required_proof_pass
